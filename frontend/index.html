<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Assistant</title>
    <link rel="stylesheet" href="/static/style.css?v=11">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>

<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="brand">
                <div class="logo-icon"><i class="ph-fill ph-student"></i></div>
                <div class="brand-text">
                    <h1>Study Assistant</h1>
                    <p>Protected Workspace</p>
                </div>
            </div>

            <!-- Navigation -->
            <nav class="nav-tabs">
                <button class="nav-btn active" data-target="view-chat">
                    <i class="ph ph-chat-circle-text"></i>
                    <span>Study Chat</span>
                </button>
                <button class="nav-btn" data-target="view-tools">
                    <i class="ph ph-wrench"></i>
                    <span>Analysis Tools</span>
                </button>
            </nav>

            <!-- Chat Specific Controls (Widget Style) -->
            <div id="file-controls" class="upload-widget">
                <div class="widget-header">
                    <h3>Upload Notes</h3>
                </div>
                <div class="file-drop-area" id="drop-area">
                    <i class="ph ph-upload-simple"></i>
                    <span class="file-msg">Click or Drag PDF</span>
                    <input type="file" id="fileElem" multiple accept=".pdf,.txt">
                </div>
                <div id="file-list" class="file-list"></div>
                <button id="upload-btn" class="upload-action-btn" disabled>
                    <i class="ph-bold ph-upload-simple"></i> Upload Files
                </button>
            </div>

            <div class="actions">
                <button id="logout-btn" class="nav-btn logout">
                    <i class="ph ph-sign-out"></i>
                    <span>Log Out</span>
                </button>
            </div>
        </aside>

        <!-- Main Views -->
        <main class="views-container">

            <!-- View 1: Chat -->
            <div id="view-chat" class="view-section active">
                <div class="chat-interface">
                    <div id="chat-messages" class="chat-messages">
                        <div class="message system">
                            <div class="bubble">
                                Hello! Upload some notes and ask me anything based on them!
                            </div>
                        </div>
                    </div>

                    <div class="input-area">
                        <form id="chat-form">
                            <input type="text" id="user-input" placeholder="Ask a question..." autocomplete="off">
                            <button type="submit" id="send-btn">
                                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <line x1="22" y1="2" x2="11" y2="13"></line>
                                    <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                                </svg>
                            </button>
                        </form>
                    </div>
                </div>
            </div>

            <!-- View 2: Analysis -->
            <div id="view-tools" class="view-section">
                <div class="analysis-container">
                    <div class="analysis-header">
                        <h2>Text Analysis</h2>
                        <div class="header-actions">
                            <span class="status-badge">Ready to Check</span>
                        </div>
                    </div>

                    <div class="editor-area">
                        <textarea id="analysis-input"
                            placeholder="Type or paste your text here to check for AI patterns and grammar..."></textarea>
                    </div>

                    <div class="editor-toolbar">
                        <button id="analyze-btn" class="primary-btn">
                            <i class="ph-bold ph-magic-wand"></i> Run Analysis
                        </button>
                    </div>

                    <div id="analysis-result"></div>
                </div>

                <div id="analysis-result">
                    <!-- Results render here -->
                </div>
            </div>
    </div>

    </main>
    </div>
    <script src="/static/script.js"></script>
</body>

</html>
